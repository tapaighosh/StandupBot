<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Don't forget your standup! — {{ team_name }}</title>
  <style>
    body { margin: 0; padding: 0; background: #0a0a0f; font-family: 'Segoe UI', Arial, sans-serif; }
    .wrapper { max-width: 560px; margin: 40px auto; background: #16162a; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,107,107,0.15); }
    .header { background: linear-gradient(135deg, #e17055, #d63031); padding: 32px 40px; text-align: center; }
    .header-logo { font-size: 32px; margin-bottom: 8px; }
    .header-title { color: white; font-size: 22px; font-weight: 700; margin: 0; }
    .body { padding: 36px 40px; }
    .greeting { font-size: 18px; font-weight: 600; color: #f0f0f8; margin: 0 0 12px; }
    .message { font-size: 15px; color: #a0a0b8; line-height: 1.7; margin: 0 0 28px; }
    .cta-btn { display: block; width: fit-content; margin: 0 auto 28px; padding: 14px 36px; background: linear-gradient(135deg, #e17055, #d63031); color: white; text-decoration: none; border-radius: 50px; font-size: 16px; font-weight: 600; text-align: center; }
    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 24px 0; }
    .link-fallback { font-size: 12px; color: #6c6c84; line-height: 1.6; word-break: break-all; }
    .link-fallback a { color: #fab1a0; }
    .footer { padding: 20px 40px; text-align: center; }
    .footer-text { font-size: 12px; color: #4a4a62; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-logo">⏰</div>
      <p class="header-title">Standup Reminder</p>
    </div>
    <div class="body">
      <p class="greeting">Hey {{ member_name }}, still with us? 👀</p>
      <p class="message">
        Your standup for <strong style="color:#f0f0f8;">{{ team_name }}</strong> is still waiting.<br />
        Don't forget — it only takes 2 minutes! The window closes soon.
      </p>
      <a class="cta-btn" href="{{ magic_link }}">Submit Now →</a>
      <hr class="divider" />
      <p class="link-fallback">
        Link: <a href="{{ magic_link }}">{{ magic_link }}</a>
      </p>
    </div>
    <div class="footer">
      <p class="footer-text">This is your standup nudge from {{ team_name }}.</p>
    </div>
  </div>
</body>
</html>
